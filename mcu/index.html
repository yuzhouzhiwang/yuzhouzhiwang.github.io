<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MCU 芯片库 · 时光</title>
<link rel="icon" type="image/svg+xml" href="/favicon-mcu.svg?v=3">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#060a14;color:#e0e6f0;font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;line-height:1.7}
a{color:#00f0ff;text-decoration:none}
.mcu-wrap{max-width:1200px;margin:0 auto;padding:24px 20px 60px}
.mcu-header{text-align:center;margin-bottom:32px}
.mcu-title{font-size:36px;font-weight:800;background:linear-gradient(135deg,#00f0ff,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px}
.mcu-subtitle{font-size:15px;color:rgba(255,255,255,.55)}
.mcu-stats{display:flex;justify-content:center;gap:32px;margin-top:20px;flex-wrap:wrap}
.mcu-stat{text-align:center}
.mcu-stat b{display:block;font-size:28px;font-weight:800;color:#00f0ff;font-family:monospace}
.mcu-stat span{font-size:12px;color:rgba(255,255,255,.5)}
.mcu-filters{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-bottom:24px;align-items:center}
.mcu-search{position:relative;flex:1;min-width:240px;max-width:400px}
.mcu-search input{width:100%;padding:10px 16px 10px 40px;border-radius:10px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.04);color:#fff;font-size:14px;outline:none;transition:border-color .2s}
.mcu-search input:focus{border-color:#00f0ff}
.mcu-search::before{content:'🔍';position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:14px}
.mcu-filter-group{display:flex;gap:6px;flex-wrap:wrap}
.mcu-filter-btn{padding:7px 16px;border-radius:20px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.04);color:rgba(255,255,255,.7);font-size:13px;cursor:pointer;transition:all .2s;user-select:none}
.mcu-filter-btn:hover{border-color:rgba(0,240,255,.4);color:#00f0ff}
.mcu-filter-btn.active{background:linear-gradient(135deg,#00f0ff,#00c8d6);color:#060a14;border-color:transparent;font-weight:600}
.mcu-section-title{font-size:20px;font-weight:700;color:#fff;margin:28px 0 16px;display:flex;align-items:center;gap:10px}
.mcu-section-title .count{font-size:13px;font-weight:400;color:rgba(255,255,255,.5);background:rgba(255,255,255,.06);padding:2px 10px;border-radius:12px}
.mcu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.mcu-card{background:linear-gradient(135deg,rgba(255,255,255,.04),rgba(255,255,255,.01));border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:20px;transition:all .25s;cursor:pointer;position:relative;overflow:hidden}
.mcu-card:hover{transform:translateY(-4px);border-color:var(--card-color,#00f0ff);box-shadow:0 12px 32px rgba(0,240,255,.1)}
.mcu-card::before{content:'';position:absolute;top:0;left:0;width:4px;height:100%;background:var(--card-color,#00f0ff)}
.mcu-card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px}
.mcu-card-name{font-size:18px;font-weight:700;color:var(--card-color,#00f0ff)}
.mcu-card-origin{font-size:11px;padding:2px 8px;border-radius:10px;font-weight:600;flex-shrink:0}
.mcu-card-origin.国内{background:rgba(74,222,128,.15);color:#4ade80}
.mcu-card-origin.国外{background:rgba(168,85,247,.15);color:#c084fc}
.mcu-card-company{font-size:12px;color:rgba(255,255,255,.55);margin-bottom:14px}
.mcu-card-badges{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.mcu-card-badge{font-size:11px;padding:3px 10px;border-radius:6px;background:rgba(255,255,255,.06);color:rgba(255,255,255,.75)}
.mcu-card-params{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:14px}
.mcu-card-param{font-size:12px;color:rgba(255,255,255,.6)}
.mcu-card-param b{color:#fff;font-weight:600}
.mcu-card-periph{display:flex;flex-wrap:wrap;gap:4px}
.mcu-card-periph span{font-size:10px;padding:2px 7px;border-radius:8px;background:rgba(0,240,255,.06);color:rgba(0,240,255,.7)}
.mcu-card-go{position:absolute;bottom:16px;right:16px;font-size:12px;color:var(--card-color,#00f0ff);font-weight:600;opacity:0;transition:opacity .2s}
.mcu-card:hover .mcu-card-go{opacity:1}

.mcu-compare{{margin-bottom:28px}}
.mcu-compare-title{{font-size:18px;font-weight:700;color:#fff;margin-bottom:12px;display:flex;align-items:center;gap:8px}}
.mcu-compare-title::before{{content:'';width:4px;height:18px;background:linear-gradient(180deg,#00f0ff,#a855f7);border-radius:2px}}
.mcu-table-wrap{{overflow-x:auto;border-radius:12px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.02)}}
.mcu-table{{width:100%;border-collapse:collapse;font-size:13px;min-width:900px}}
.mcu-table th{{background:rgba(0,240,255,.08);color:#00f0ff;font-weight:600;padding:10px 12px;text-align:left;white-space:nowrap;border-bottom:1px solid rgba(255,255,255,.1);position:sticky;top:0}}
.mcu-table td{{padding:9px 12px;border-bottom:1px solid rgba(255,255,255,.05);color:rgba(255,255,255,.8);white-space:nowrap}}
.mcu-table tr:hover td{{background:rgba(0,240,255,.04)}}
.mcu-table .chip-name{{font-weight:700;color:var(--chip-color,#fff)}}
.mcu-table .chip-name a{{color:inherit;text-decoration:none}}
.mcu-table .chip-name a:hover{{text-decoration:underline}}
.mcu-table .origin-badge{{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11px;font-weight:600}}
.mcu-table .origin-badge.国内{{background:rgba(74,222,128,.15);color:#4ade80}}
.mcu-table .origin-badge.国外{{background:rgba(168,85,247,.15);color:#c084fc}}
.mcu-table .bits-badge{{display:inline-block;padding:1px 8px;border-radius:6px;background:rgba(255,255,255,.08);color:rgba(255,255,255,.7);font-size:11px;font-weight:600}}
.mcu-empty{text-align:center;padding:60px 20px;color:rgba(255,255,255,.4);font-size:15px}
#site-footer{margin-top:40px}
.footer-bottom{text-align:center;padding:20px 0;border-top:1px solid rgba(255,255,255,.08);color:rgba(255,255,255,.5);font-size:13px}
@media(max-width:600px){.mcu-title{font-size:26px}.mcu-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="mcu-wrap">
  <div class="mcu-header">
    <h1 class="mcu-title">🔬 MCU 芯片库</h1>
    <p class="mcu-subtitle">国内外常用 8/16/32 位微控制器 · 参数对比 · 引脚可视化 · 示例代码 · 官方资料</p>
    <div class="mcu-stats">
      <div class="mcu-stat"><b id="stat-total">14</b><span>款芯片</span></div>
      <div class="mcu-stat"><b id="stat-domestic">8</b><span>国产芯片</span></div>
      <div class="mcu-stat"><b id="stat-foreign">6</b><span>国外芯片</span></div>
      <div class="mcu-stat"><b>3</b><span>位宽分类</span></div>
    </div>
  </div>

  <div class="mcu-filters">
    <div class="mcu-search">
      <input type="text" id="search-input" placeholder="搜索芯片型号 / 公司 / 内核...">
    </div>
    <div class="mcu-filter-group" id="origin-filter">
      <span class="mcu-filter-btn active" data-origin="all">全部</span>
      <span class="mcu-filter-btn" data-origin="国内">🇨🇳 国内</span>
      <span class="mcu-filter-btn" data-origin="国外">🌍 国外</span>
    </div>
    <div class="mcu-filter-group" id="bits-filter">
      <span class="mcu-filter-btn active" data-bits="all">全部位宽</span>
      <span class="mcu-filter-btn" data-bits="8">8位</span>
      <span class="mcu-filter-btn" data-bits="16">16位</span>
      <span class="mcu-filter-btn" data-bits="32">32位</span>
    </div>
  </div>

  <div class="mcu-compare">
    <div class="mcu-compare-title">📊 芯片参数对比 <span id="compare-count" style="font-size:13px;font-weight:400;color:rgba(255,255,255,.5)">(15款)</span></div>
    <div class="mcu-table-wrap">
      <table class="mcu-table" id="compare-table">
        <thead>
          <tr>
            <th>芯片型号</th>
            <th>产地</th>
            <th>位宽</th>
            <th>内核</th>
            <th>主频</th>
            <th>Flash</th>
            <th>SRAM</th>
            <th>I/O</th>
            <th>封装</th>
          </tr>
        </thead>
        <tbody id="compare-tbody"></tbody>
      </table>
    </div>
  </div>

  <div id="cards-container"></div>
  <div class="mcu-empty" id="empty-tip" style="display:none">没有找到匹配的芯片，试试其他关键词或筛选条件</div>
</div>

<footer id="site-footer">
  <div class="footer-inner">
    <div class="footer-bottom">
      ©2023-2026 By 时光 · 保留所有权利 | <a href="/" style="color:#00f0ff">返回首页</a>
    </div>
  </div>
</footer>

<script>
const CHIPS = [{"name": "ATmega328P", "company": "Microchip (Atmel)", "origin": "国外", "bits": 8, "core": "AVR 8-bit RISC", "freq": "20 MHz", "flash": "32 KB", "sram": "2 KB", "io": "23", "package": "TQFP-32 / DIP-28", "color": "#00a651", "url": "/mcu/atmega328p/", "peripherals": ["UART", "SPI", "I2C", "Timer×3", "PWM×6"]}, {"name": "PIC16F877A", "company": "Microchip", "origin": "国外", "bits": 8, "core": "PIC 8-bit RISC", "freq": "20 MHz", "flash": "14 KB", "sram": "368 B", "io": "33", "package": "QFP-44 / DIP-40", "color": "#0072ce", "url": "/mcu/pic16f877a/", "peripherals": ["UART", "SPI", "I2C", "Timer×3", "PWM×2"]}, {"name": "MSP430G2553", "company": "Texas Instruments", "origin": "国外", "bits": 16, "core": "MSP430 16-bit RISC", "freq": "16 MHz", "flash": "16 KB", "sram": "512 B", "io": "24", "package": "TSSOP-20 / QFN-32", "color": "#be1e2d", "url": "/mcu/msp430g2553/", "peripherals": ["UART", "SPI", "I2C", "Timer×2", "PWM"]}, {"name": "STM32F103C8T6", "company": "STMicroelectronics", "origin": "国外", "bits": 32, "core": "ARM Cortex-M3", "freq": "72 MHz", "flash": "64 KB", "sram": "20 KB", "io": "37", "package": "LQFP-48", "color": "#03234b", "url": "/mcu/stm32f103c8t6/", "peripherals": ["USART×3", "SPI×2", "I2C×2", "USB 2.0 FS", "CAN"]}, {"name": "STM32F407VET6", "company": "STMicroelectronics", "origin": "国外", "bits": 32, "core": "ARM Cortex-M4F (DSP+FPU)", "freq": "168 MHz", "flash": "512 KB", "sram": "192 KB", "io": "82", "package": "LQFP-100", "color": "#03234b", "url": "/mcu/stm32f407vet6/", "peripherals": ["USART×6", "SPI×3", "I2C×3", "USB OTG HS/FS", "CAN×2"]}, {"name": "RP2040", "company": "Raspberry Pi", "origin": "国外", "bits": 32, "core": "ARM Cortex-M0+ 双核", "freq": "133 MHz", "flash": "外置 (最多16MB)", "sram": "264 KB", "io": "30", "package": "QFN-56", "color": "#c51a4a", "url": "/mcu/rp2040/", "peripherals": ["UART×2", "SPI×2", "I2C×2", "USB 1.1 Host/Device", "PWM×16"]}, {"name": "STC89C52RC", "company": "宏晶 STC", "origin": "国内", "bits": 8, "core": "8051 兼容 8-bit", "freq": "12-40 MHz", "flash": "8 KB", "sram": "512 B", "io": "32", "package": "DIP-40 / LQFP-44", "color": "#e60012", "url": "/mcu/stc89c52rc/", "peripherals": ["UART", "Timer×3", "PWM×4", "Watchdog", "SPI(软件)"]}, {"name": "STC8H8K64U", "company": "宏晶 STC", "origin": "国内", "bits": 8, "core": "8051 增强 8-bit (1T)", "freq": "48 MHz", "flash": "64 KB", "sram": "8 KB", "io": "56", "package": "LQFP-64 / QFN-48", "color": "#e60012", "url": "/mcu/stc8h8k64u/", "peripherals": ["UART×4", "SPI", "I2C", "USB 2.0 FS", "Timer×5"]}, {"name": "CH552G", "company": "沁恒 WCH", "origin": "国内", "bits": 8, "core": "8051 增强 8-bit (1T)", "freq": "24 MHz", "flash": "16 KB", "sram": "1 KB", "io": "16", "package": "SOP-16 / TSSOP-20", "color": "#0066b3", "url": "/mcu/ch552g/", "peripherals": ["UART", "USB 2.0 FS (Device/Host)", "SPI", "I2C", "Timer×3"]}, {"name": "HC32L130K8TA", "company": "小华半导体 XHSC", "origin": "国内", "bits": 16, "core": "ARM Cortex-M0+", "freq": "48 MHz", "flash": "64 KB", "sram": "8 KB", "io": "56", "package": "LQFP-64 / QFN-48", "color": "#00a0e9", "url": "/mcu/hc32l130k8ta/", "peripherals": ["UART×3", "SPI×2", "I2C×2", "Timer×6", "PWM×8"]}, {"name": "HC32F005C6PA", "company": "小华半导体 XHSC", "origin": "国内", "bits": 32, "core": "ARM Cortex-M0+", "freq": "32 MHz", "flash": "32 KB", "sram": "4 KB", "io": "18", "package": "TSSOP-20 / QFN-20", "color": "#00a0e9", "url": "/mcu/hc32f005c6pa/", "peripherals": ["UART×2", "SPI", "I2C", "Timer×3", "PWM×6"]}, {"name": "GD32F103C8T6", "company": "兆易创新 GigaDevice", "origin": "国内", "bits": 32, "core": "ARM Cortex-M3", "freq": "108 MHz", "flash": "64 KB", "sram": "20 KB", "io": "37", "package": "LQFP-48", "color": "#009944", "url": "/mcu/gd32f103c8t6/", "peripherals": ["USART×3", "SPI×2", "I2C×2", "USB 2.0 FS", "CAN"]}, {"name": "CH32V307VCT6", "company": "沁恒 WCH", "origin": "国内", "bits": 32, "core": "青稞 V4F RISC-V (FPU)", "freq": "144 MHz", "flash": "256 KB", "sram": "64 KB", "io": "80", "package": "LQFP-100", "color": "#0066b3", "url": "/mcu/ch32v307vct6/", "peripherals": ["USART×8", "SPI×3", "I2C×2", "USB 2.0 HS (480Mbps)", "千兆以太网 MAC+PHY"]}, {"name": "MM32L0020", "company": "灵动微 MindMotion", "origin": "国内", "bits": 32, "core": "ARM Cortex-M0", "freq": "48 MHz", "flash": "32 KB", "sram": "4 KB", "io": "18", "package": "TSSOP-20 / QFN-20", "color": "#e67e22", "url": "/mcu/mm32l0020/", "peripherals": ["UART×2", "SPI", "I2C", "Timer×3", "PWM×6", "ADC×8"]}, {"name": "ESP32-WROOM-32", "company": "乐鑫 Espressif", "origin": "国内", "bits": 32, "core": "Xtensa LX6 双核 (或 RISC-V)", "freq": "240 MHz", "flash": "4 MB (模组内置)", "sram": "520 KB", "io": "34", "package": "模组 18×25.5mm", "color": "#e7352c", "url": "/mcu/esp32wroom32/", "peripherals": ["UART×3", "SPI×4", "I2C×2", "WiFi 2.4GHz", "Bluetooth 4.2/5.0"]}];
let curOrigin = 'all', curBits = 'all', curSearch = '';

function render() {
  const container = document.getElementById('cards-container');
  const filtered = CHIPS.filter(c => {
    if(curOrigin !== 'all' && c.origin !== curOrigin) return false;
    if(curBits !== 'all' && c.bits !== parseInt(curBits)) return false;
    if(curSearch) {
      const q = curSearch.toLowerCase();
      return c.name.toLowerCase().includes(q) || c.company.toLowerCase().includes(q) || c.core.toLowerCase().includes(q);
    }
    return true;
  });
  
  // 渲染对比表格
  const tbody = document.getElementById('compare-tbody');
  if(tbody) {
    tbody.innerHTML = filtered.map(c => '<tr style="--chip-color:' + c.color + '">' +
      '<td class="chip-name"><a href="' + c.url + '">' + c.name + '</a></td>' +
      '<td><span class="origin-badge ' + c.origin + '">' + c.origin + '</span></td>' +
      '<td><span class="bits-badge">' + c.bits + '位</span></td>' +
      '<td>' + c.core + '</td>' +
      '<td>' + c.freq + '</td>' +
      '<td>' + c.flash + '</td>' +
      '<td>' + c.sram + '</td>' +
      '<td>' + c.io + '</td>' +
      '<td>' + c.package + '</td>' +
    '</tr>').join('');
  }
  const cc = document.getElementById('compare-count');
  if(cc) cc.textContent = '(' + filtered.length + '款)';
  
  if(filtered.length === 0) {
    container.innerHTML = '';
    document.getElementById('empty-tip').style.display = 'block';
    return;
  }
  document.getElementById('empty-tip').style.display = 'none';
  
  // 按国内/国外分组
  const domestic = filtered.filter(c => c.origin === '国内');
  const foreign = filtered.filter(c => c.origin === '国外');
  
  let html = '';
  if(foreign.length > 0) {
    html += '<div class="mcu-section-title">🌍 国外芯片 <span class="count">' + foreign.length + ' 款</span></div>';
    html += '<div class="mcu-grid">' + foreign.map(cardHTML).join('') + '</div>';
  }
  if(domestic.length > 0) {
    html += '<div class="mcu-section-title">🇨🇳 国内芯片 <span class="count">' + domestic.length + ' 款</span></div>';
    html += '<div class="mcu-grid">' + domestic.map(cardHTML).join('') + '</div>';
  }
  container.innerHTML = html;
}

function cardHTML(c) {
  const periph = c.peripherals.map(p => '<span>' + p + '</span>').join('');
  return '<a href="' + c.url + '" class="mcu-card" style="--card-color:' + c.color + '">' +
    '<div class="mcu-card-top">' +
      '<div class="mcu-card-name">' + c.name + '</div>' +
      '<span class="mcu-card-origin ' + c.origin + '">' + c.origin + '</span>' +
    '</div>' +
    '<div class="mcu-card-company">' + c.company + '</div>' +
    '<div class="mcu-card-badges">' +
      '<span class="mcu-card-badge">' + c.bits + '-bit</span>' +
      '<span class="mcu-card-badge">' + c.freq + '</span>' +
      '<span class="mcu-card-badge">' + c.package + '</span>' +
    '</div>' +
    '<div class="mcu-card-params">' +
      '<div class="mcu-card-param">Flash <b>' + c.flash + '</b></div>' +
      '<div class="mcu-card-param">SRAM <b>' + c.sram + '</b></div>' +
      '<div class="mcu-card-param">I/O <b>' + c.io + '</b></div>' +
      '<div class="mcu-card-param">内核 <b>' + c.core.split(' ')[0] + '</b></div>' +
    '</div>' +
    '<div class="mcu-card-periph">' + periph + '</div>' +
    '<span class="mcu-card-go">查看详情 →</span>' +
  '</a>';
}

// 事件绑定
document.getElementById('origin-filter').addEventListener('click', e => {
  if(e.target.classList.contains('mcu-filter-btn')) {
    document.querySelectorAll('#origin-filter .mcu-filter-btn').forEach(b => b.classList.remove('active'));
    e.target.classList.add('active');
    curOrigin = e.target.dataset.origin;
    render();
  }
});
document.getElementById('bits-filter').addEventListener('click', e => {
  if(e.target.classList.contains('mcu-filter-btn')) {
    document.querySelectorAll('#bits-filter .mcu-filter-btn').forEach(b => b.classList.remove('active'));
    e.target.classList.add('active');
    curBits = e.target.dataset.bits;
    render();
  }
});
document.getElementById('search-input').addEventListener('input', e => {
  curSearch = e.target.value.trim();
  render();
});

render();
</script>
</body>
</html>
