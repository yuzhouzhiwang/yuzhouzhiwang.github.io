<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }
        
        body {
            font: 14px "微软雅黑";
            background: #fff9ed;
        }
        
        .w {
            width: 980px;
            margin: 0 auto;
        }
        
        .header {
            height: 128px;
            background: url(images/head_bg.jpg);
        }
        
        .header li {
            float: left;
            list-style: none;
        }
        
        .header a {
            text-decoration: none;
            color: #fff;
            display: block;
            width: 119px;
            height: 91px;
            text-align: center;
            line-height: 91px;
        }
        
        .header a:hover {
            background: url(images/xuanfu.png) no-repeat;
        }
        
        .banner {
            position: relative;
        }
        
        .banner span {
            position: absolute;
            right: 30px;
            top: 10px;
            background: #000;
            color: #fff;
            padding: 5px 10px;
        }
        
        .banner span:hover {
            cursor: pointer;
        }
        
        .change {
            color: #f60;
            font-size: 50px;
            font-weight: bold;
            text-align: center;
            line-height: 373px;
            transition: all 1s;
        }
        
        .footer {
            height: 100px;
            background: #000;
            padding-top: 50px;
            text-align: center;
            color: #fff;
        }
        
        .footer p {
            margin-bottom: 30px;
        }
    </style>
</head>

<body>
    <div class="header">
        <ul class="w">
            <li><img src="images/logo.png" alt=""></li>
            <li><a href="#">穿搭速递</a></li>
            <li><a href="#">时尚大片</a></li>
            <li><a href="#">星着装</a></li>
            <li><a href="#">时尚圈</a></li>
            <li><a href="#">时尚专栏</a></li>
            <li><a href="#">会员/登陆</a></li>
        </ul>
    </div>
    <div class="banner w">
        <img src="images/banner.jpg" alt="">
        <span>关闭</span>
    </div>
    <div class="footer">
        <p>Copyright ? 2006-2016 CHAOLIUFUSHIcom, All rights reserved.</p>
        <p>2001-2018，版权所有 潮流服饰 85CP备13385453</p>
    </div>
    <script>
        var banner = document.querySelector('.banner');
        var span = banner.querySelector('span');
        span.onclick = function() {
            banner.innerHTML = '欢迎进入';
            banner.className = 'change';
        }
    </script>
</body>

</html>
