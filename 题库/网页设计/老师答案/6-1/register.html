<!DOCTYPE html>
<html lang="en">

<head>

    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }
        
        form {
            width: 240px;
            padding: 30px 50px;
            margin: 200px auto 0;
            border: 1px solid #ccc;
        }
        
        p {
            margin-bottom: 20px;
        }
        
        .btn {
            width: 70px;
            height: 30px;
            background: #0000ff;
            color: #fff;
            line-height: 30px;
            margin-left: 50px;
        }
    </style>
</head>

<body>
    <form action="#">
        <p>姓名：<input type="text" /></p>
        <p>密码：<input type="password" /></p>
        <p>性别：男<input type="radio" name="sex">　女<input type="radio" name="sex"></p>
        <p><input type="button" value="登录" class="btn"></p>
    </form>
</body>

</html>
