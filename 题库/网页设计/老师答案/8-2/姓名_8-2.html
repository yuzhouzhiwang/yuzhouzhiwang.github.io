<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }
        
        body {
            font: 14px '微软雅黑';
            background: #fff9ed;
        }
        
        .w {
            width: 980px;
            margin: 0 auto;
        }
        
        .content {
            background: #ec6e47;
            padding: 5px 30px;
            box-sizing: border-box;
        }
        
        .white {
            background: #fff;
            padding: 5px 10px;
            overflow: hidden;
        }
        
        dl,
        dt,
        dd {
            float: left;
        }
        
        .left,
        .center {
            width: 280px;
            margin-right: 10px;
        }
        
        .right {
            width: 320px;
            height: 310px;
        }
        
        .dt01,
        .dt03 {
            margin-bottom: 5px;
        }
        
        .dt05 img {
            height: 310px;
        }
        
        a {
            display: block;
            width: 118px;
            background: #000;
            color: #fff;
            text-align: center;
            text-decoration: none;
        }
        
        a:hover {
            background: #ea6c46;
        }
        
        .dd01 a {
            line-height: 169px;
        }
        
        .dd02 a {
            line-height: 137px;
        }
        
        .dd03 a {
            line-height: 117px;
        }
        
        .dd04 a {
            line-height: 188px;
        }
        
        .dd05 a {
            line-height: 310px;
            width: 115px;
        }
        
        dt:hover img {
            transform: scale(1.1);
        }
        
        dt {
            overflow: hidden;
        }
        
        .dt01 {
            height: 169px;
        }
        
        .dt02 {
            height: 137px;
        }
        
        .dt03 {
            height: 117px;
        }
        
        .dt04 {
            height: 188px;
        }
        
        .dt05 {
            height: 310px;
        }
    </style>
</head>

<body>
    <div class="banner w">
        <img src="images/banner.jpg" alt="">
    </div>
    <div class="content w">
        <div class="white">
            <dl class="left">
                <dt class="dt01"><img src="images/pic01.jpg" alt=""></dt>
                <dd class="dd01"><a href="#">明星风尚</a></dd>
                <dt class="dt02"><img src="images/pic02.jpg" alt=""></dt>
                <dd class="dd02"><a href="#">时尚博主</a></dd>
            </dl>
            <dl class="center">
                <dt class="dt03"><img src="images/pic03.jpg" alt=""></dt>
                <dd class="dd03"><a href="#">流行搭配</a></dd>
                <dt class="dt04"><img src="images/pic04.jpg" alt=""></dt>
                <dd class="dd04"><a href="#">精选秀场</a></dd>
            </dl>
            <dl class="right">
                <dt class="dt05"><img src="images/pic05.jpg" alt=""></dt>
                <dd class="dd05"><a href="#">环球街拍</a></dd>

            </dl>
        </div>
    </div>
</body>

</html>
