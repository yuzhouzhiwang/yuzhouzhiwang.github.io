<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }
        
        .all {
            width: 980px;
            margin: 0 auto;
            font-family: "微软雅黑";
        }
        
        .header {
            height: 627px;
            background: url(images/bg.jpg) no-repeat;
            padding: 10px;
        }
        
        .header ul {
            height: 86px;
            background: url(images/nav.png) no-repeat center;
        }
        
        .header li {
            float: left;
            list-style: none;
            margin: 40px 0 0 100px;
        }
        
        .header .more {
            margin-left: 300px;
        }
        
        .header a {
            text-decoration: none;
            color: #666;
            font-size: 16px;
            font-weight: bold;
        }
        
        .header a:hover {
            color: #633;
        }
        
        .content {
            height: 400px;
            background: url(images/dongtai.jpg) no-repeat center top;
        }
        
        .content dl {
            float: left;
            /*如果浮动不起作用，给元素设置宽度*/
            width: 294px;
            margin: 100px 20px 0 0;
        }
        
        .content dt {
            height: 137px;
            background: url(images/news1.jpg) no-repeat;
        }
        
        .center dt {
            background: url(images/news2.jpg) no-repeat;
        }
        
        .right dt {
            background: url(images/news3.jpg) no-repeat;
        }
        
        .content dt:hover {
            background: url(images/news4.jpg) no-repeat;
        }
        
        .content dd:nth-child(3) {
            font: 14px/20px "楷体";
            color: #666;
            height: 100px;
            /*为了让下方的阴影图对齐*/
        }
    </style>
</head>

<body>
    <div class="all">
        <div class="header">
            <ul>
                <li><a href="#">网站首页</a></li>
                <li><a href="#">网站首页</a></li>
                <li class="more"><a href="#">网站首页</a></li>
                <li><a href="#">网站首页</a></li>
            </ul>
        </div>
        <div class="content">
            <dl class="left">
                <dt></dt>
                <dd>
                    <h2>优惠活动</h2>
                </dd>
                <dd>新年订单有特大惊喜！</dd>
                <dd><img src="images/yinying.jpg" alt=""></dd>
            </dl>
            <dl class="center">
                <dt></dt>
                <dd>
                    <h2>宝贝写真应注意什么？</h2>
                </dd>
                <dd>孩子拍摄的时候如果是陌生人接触的话会比较容易哭闹，如果换做是亲近的或者比较平时比较熟悉玩得来的就会好很多。</dd>
                <dd><img src="images/yinying.jpg" alt=""></dd>
            </dl>
            <dl class="right">
                <dt></dt>
                <dd>
                    <h2>宝贝庆生会</h2>
                </dd>
                <dd>为新生宝宝准备的生日party,参与者可获得精美生日礼物一份。</dd>
                <dd><img src="images/yinying.jpg" alt=""></dd>
            </dl>
        </div>
    </div>
</body>

</html>
