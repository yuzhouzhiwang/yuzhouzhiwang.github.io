<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }
        
        body {
            color: #dd8787;
            font: 14px "微软雅黑";
        }
        
        .content {
            width: 980px;
            margin: 0 auto;
            height: 934px;
            padding-left: 150px;
            background: url(images/content_bg.jpg) no-repeat center;
        }
        
        .content h2 {
            width: 454px;
            height: 80px;
            font-weight: normal;
            font-size: 20px;
            line-height: 80px;
            background: url(images/step.jpg) no-repeat right;
        }
        
        .content h3 {
            width: 444px;
            height: 45px;
            font-weight: normal;
            font-size: 20px;
            line-height: 45px;
            border-bottom: #dd8787 1px solid;
        }
        
        .content p {
            line-height: 50px;
        }
        
        .content span {
            display: inline-block;
            width: 120px;
            text-align: right;
        }
        
        .right {
            width: 320px;
            height: 28px;
            border: 1px solid #dd8787;
        }
        
        select {
            border: #dd8787 1px solid;
            width: 171px;
        }
        
        textarea {
            border: #dd8787 1px solid;
            width: 380px;
            height: 112px;
            padding: 20px;
            color: #aaaaaa;
            font-size: 12px;
            resize: none;
            /*禁止拖曳*/
        }
        
        .btn {
            width: 166px;
            height: 46px;
            background: url(images/btn.jpg) no-repeat;
            border: none;
            margin-left: 200px;
        }
        
        .footer {
            background: #fe668f;
            padding: 30px 0;
            line-height: 26px;
            color: #fff;
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="content">
        <h2>注册步骤：</h2>
        <h3>您的账号信息</h3>
        <form action="#">
            <p><span>注册方式：</span>
                <input type="radio" name="zc">E-mail注册&nbsp;&nbsp;&nbsp;
                <input type="radio" name="zc">手机注册
            </p>
            <p><span>注册邮箱：</span>
                <input type="text" class="right">
            </p>
            <p><span>注册手机：</span>
                <input type="text" class="right">
            </p>
            <p><span>登陆密码：</span>
                <input type="text" class="right">
            </p>
            <p><span>昵称：</span>
                <input type="text" class="right">
            </p>
        </form>
        <h3>您的个人信息</h3>
        <form action="#">
            <p><span>性别：</span>
                <input type="radio" name="zc">男&nbsp;&nbsp;&nbsp;
                <input type="radio" name="zc">女
            </p>
            <p><span>学历：</span>
                <select>
                    <option >-请选择-</option>
                    <option >中职/高中</option>
                    <option >专科/本科</option>
                    <option >硕士</option>
                </select>
            </p>
            <p><span>所在城市：</span>
                <select>
                    <option >-请选择-</option>
                    <option selected>北京</option>
                    <option >上海</option>
                    <option >广州</option>
                </select>
            </p>
            <p><span>兴趣爱好：</span>
                <input type="checkbox">足球&nbsp;&nbsp;
                <input type="checkbox">篮球&nbsp;&nbsp;
                <input type="checkbox">游泳&nbsp;&nbsp;
                <input type="checkbox">唱歌&nbsp;&nbsp;
                <input type="checkbox">跑步&nbsp;&nbsp;
                <input type="checkbox">瑜伽
            </p>
            <p><span>自我介绍：</span>
                <textarea>评论的时候，请遵纪守法并注意语言文明，多给文档分享人一些支持。</textarea>
            </p>
            <p><input type="submit" class="btn" value="" /></p>
        </form>
    </div>
    <div class="footer">
        <p>Copyright 2006-2016 QIANNIANZHILIANcom, All rights reserved.</p>
        <p>2001-2018，版权所有 千年之恋 85CP备13385453</p>
    </div>
</body>

</html>
