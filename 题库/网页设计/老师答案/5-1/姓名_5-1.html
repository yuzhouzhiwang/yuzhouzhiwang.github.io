<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }
        
        .w {
            width: 980px;
            margin: 0 auto;
        }
        
        .header {
            height: 80px;
            padding: 20px 0;
        }
        
        .header a {
            display: block;
            width: 80px;
            padding: 0 10px;
            line-height: 20px;
            text-decoration: none;
            color: black;
        }
        
        .header ul {
            float: right;
        }
        
        .header li {
            float: left;
            list-style: none;
        }
        
        .list {
            display: none;
        }
        
        .list a {
            width: 70px;
            /* padding: 0 10px; */
            line-height: 30px;
            font-size: 14px;
            border: 1px solid #ccc;
            background: #fff;
            border-top: none;
        }
        
        .nav {
            height: 40px;
            background: #404042;
        }
        
        .nav li {
            float: left;
            list-style: none;
        }
        
        .nav a {
            display: block;
            color: #fff;
            text-decoration: none;
            padding: 0 40px;
            line-height: 40px;
        }
        
        .one {
            background: #da5454;
        }
        
        .nav a:hover {
            background: #da5454;
        }
        
        .banner img {
            width: 100%;
            height: 600px;
            /* background: url(images/banner.jpg) no-repeat center; */
        }
    </style>
</head>

<body>
    <div class="header w">
        <img src="images/logo.png" alt="">
        <ul>
            <li class="li01">
                <a href="#">登录</a>
                <div class="list">
                    <a href="#">QQ登录</a>
                    <a href="#">微信登录</a>
                    <a href="#">手机登录</a>
                </div>
            </li>
            <li class="li01"><a href="#">注册</a>
                <div class="list">
                    <a href="#">PC端注册</a>
                    <a href="#">移动端注册</a>
                </div>
            </li>
        </ul>
    </div>
    <div class="nav">
        <ul class="w">
            <li><a href="#" class="one">首页</a></li>
            <li><a href="#">设计案例</a></li>
            <li><a href="#">装修图库</a></li>
            <li><a href="#">有问必答</a></li>
            <li><a href="#">逛商品</a></li>
        </ul>
    </div>
    <div class="banner">
        <img src="images/banner.jpg" alt="">
    </div>
    <script>
        var li01s = document.querySelectorAll('.li01');
        for (var i = 0; i < li01s.length; i++) {
            li01s[i].onmouseover = function() {
                this.children[1].style.display = 'block';
            }
            li01s[i].onmouseout = function() {
                this.children[1].style.display = 'none';
            }
        }
    </script>
</body>

</html>
