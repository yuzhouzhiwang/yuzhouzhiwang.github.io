<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }
        
        body {
            font: 14px "微软雅黑";
            background: #fff9ed;
        }
        
        .content_bg {
            width: 980px;
            margin: 0 auto;
        }
        
        h2 {
            width: 260px;
            height: 45px;
            background: #ea6c46;
            color: #fff;
            text-align: center;
            line-height: 45px;
        }
        
        .content {
            width: 980px;
            height: 350px;
            border: 1px solid #ccc;
        }
        
        dl {
            float: left;
            width: 229px;
            border: 1px solid #ccc;
            margin: 5px;
        }
        
        .dl01 {
            margin-left: 12px;
        }
        
        dt {
            width: 229px;
            height: 212px;
            border-bottom: 1px solid #ccc;
            background: url(images/match01.jpg) no-repeat;
        }
        
        .dl02 dt {
            background: url(images/match02.jpg) no-repeat;
        }
        
        .dl03 dt {
            background: url(images/match03.jpg) no-repeat;
        }
        
        .dl04 dt {
            background: url(images/match04.jpg) no-repeat;
        }
        
        .dl01 dt:hover {
            background: url(images/match05.jpg) no-repeat;
        }
        
        .dl02 dt:hover {
            background: url(images/match06.jpg) no-repeat;
        }
        
        .dl03 dt:hover {
            background: url(images/match07.jpg) no-repeat;
        }
        
        .dl04 dt:hover {
            background: url(images/match08.jpg) no-repeat;
        }
        
        dd:nth-child(2) {
            font-size: 22px;
            color: #7a7a7a;
            background: #fff;
            text-align: center;
            line-height: 3em;
        }
        
        dd:nth-child(3) a {
            display: block;
            width: 200px;
            height: 38px;
            background: #f3734a url(images/gouwu.jpg) no-repeat;
            margin: 10px auto;
            padding-left: 80px;
            color: #fff;
            text-decoration: none;
            line-height: 38px;
            box-sizing: border-box;
        }
    </style>
</head>

<body>
    <div class="content_bg">
        <h2>潮流前沿/Tidal current</h2>
        <div class="content">
            <dl class="dl01">
                <dt></dt>
                <dd>潮流饰品</dd>
                <dd><a href="#">快速购买通道</a></dd>
            </dl>
            <dl class="dl02">
                <dt></dt>
                <dd>时尚女鞋</dd>
                <dd><a href="#">快速购买通道</a></dd>
            </dl>
            <dl class="dl03">
                <dt></dt>
                <dd>精品包包</dd>
                <dd><a href="#">快速购买通道</a></dd>
            </dl>
            <dl class="dl04">
                <dt></dt>
                <dd>百搭衣帽</dd>
                <dd><a href="#">快速购买通道</a></dd>
            </dl>
        </div>
    </div>
</body>

</html>
