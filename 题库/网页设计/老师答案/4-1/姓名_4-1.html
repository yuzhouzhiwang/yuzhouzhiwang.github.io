<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }
        
        .w {
            width: 980px;
            margin: 0 auto;
        }
        
        .header {
            height: 70px;
            padding-top: 20px;
        }
        
        .nav {
            height: 48px;
            background: #fe668f;
        }
        
        .nav li {
            float: left;
            list-style: none;
        }
        
        .nav a {
            display: inline-block;
            text-decoration: none;
            padding: 0 50px;
            font-size: 16px;
            color: #fff;
            line-height: 48px;
        }
        
        .nav a:hover {
            background: #fe9ab5;
        }
        
        .last {
            background: #fe9ab5;
        }
        
        .banner {
            height: 429px;
            overflow: hidden;
            /*1、多余内容裁剪掉；
            2、清除子元素浮动给父元素带来的影响*/
        }
    </style>
</head>

<body>
    <div class="header w">
        <img src="images/logo.jpg" alt="">
    </div>
    <div class="nav">
        <ul class="w">
            <li><a href="#">首页</a></li>
            <li><a href="#">会员</a></li>
            <li><a href="#">活动</a></li>
            <li><a href="#">直播</a></li>
            <li><a href="#">视频</a></li>
            <li><a href="#" class="last">注册</a></li>
        </ul>
    </div>
    <div class="banner w">
        <img src="images/banner1.jpg" alt="">
        <img src="images/banner2.jpg" alt="">
        <img src="images/banner3.jpg" alt="">
        <img src="images/banner4.jpg" alt="">
    </div>
    <script>
        var banner = document.querySelector('.banner');
        var pics = banner.querySelectorAll('img');
        var timer = setInterval(autoChange, 2000) //此处函数名不用引号
        var index = 0; //最开始显示图片的索引号
        function autoChange() {
            //pics = [img01,img02,img03,img04]
            //       0     1      2    3     0
            index++;
            if (index == pics.length) {
                index = 0
            }
            //排他思想，所有图片都不显示；
            //只有当前索引号为index的图片显示。
            for (var i = 0; i < pics.length; i++) {
                pics[i].style.display = 'none'
            }
            pics[index].style.display = 'block'
        }
    </script>
</body>

</html>
