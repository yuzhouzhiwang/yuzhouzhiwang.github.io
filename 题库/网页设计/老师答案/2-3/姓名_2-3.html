<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }
        
        body {
            font: 14px "微软雅黑";
            text-align: center;
            /*除考试外，尽量不要将所有文字居中*/
        }
        
        .footer {
            background: #525252;
            color: #fff;
            width: 980px;
            line-height: 2em;
            padding: 30px 0;
            /* margin-top: 10px; */
            margin: 10px auto 0;
        }
        /* .footer ul {
            width: 400px;
            margin: 0 auto;
            overflow: hidden;
        }
        
        .footer li {
            float: left;
            list-style: none;
        } */
        
        .footer a {
            color: #fff;
            text-decoration: none;
            margin-right: 20px;
        }
        
        .footer a:hover {
            color: #ff0000;
        }
        
        .ewm {
            width: 110px;
            background: #ebebeb;
            position: fixed;
            /*固定定位是对于浏览器来定位；
                              相对定位是相对于自身来移动；
                              绝对定位是相对于其开了定位的父盒子来移动。*/
            right: 5%;
            bottom: 20px;
        }
        
        .ewm img {
            margin: 5px 0;
        }
        
        .ewm span {
            /* display: block; */
            /*开定位后，变成块元素*/
            width: 20px;
            line-height: 20px;
            font-size: 16px;
            color: #ff0000;
            border: 1px solid #ccc;
            position: absolute;
            right: 0;
            top: -22px;
            /*高度+边框*/
        }
        
        .ewm span:hover {
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="footer">
        <p>
            <a href="#" class="">关于我们</a>
            <a href="#" class="">联系我们</a>
            <a href="#" class="">意见建议</a>
            <a href="#" class="">帮助中心</a>
            <a href="#" class="">使用条款</a></p>
        <!-- <ul>
            <li><a href="#">关于我们</a></li>
            <li><a href="#">联系我们</a></li>
            <li><a href="#">意见建议</a></li>
            <li><a href="#">帮助中心</a></li>
            <li><a href="#">使用条款</a></li>
        </ul> -->
        <p>联网医疗保健信息服务 审核同意书 浙卫网审【2014】6号 2003-2016 TMALL.COM 版权所有</p>
    </div>
    <div class="ewm">
        <p>谭木记客户端</p>
        <img src="images/ewm.png" alt="二维码图片">
        <span>×</span>
    </div>
    <script>
        // 1、获取元素；
        var span = document.querySelector('span');
        //2、绑定事件
        span.addEventListener('click', function() {
            //3、产生效果
            this.parentNode.style.display = 'none'
        })
    </script>
</body>

</html>
