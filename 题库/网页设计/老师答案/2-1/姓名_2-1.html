<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }
        
        .all {
            width: 980px;
            margin: 0 auto;
        }
        
        .header {
            height: 114px;
            background: #525252 url(images/logo.jpg) no-repeat center;
        }
        
        .nav {
            height: 100px;
            background: #4d0506;
            margin: 10px 0;
        }
        
        .nav li {
            float: left;
            list-style: none;
        }
        
        .nav a {
            color: #fff;
            text-decoration: none;
            padding: 0 20px;
            font: 20px/100px "隶书";
        }
        
        .nav a:hover {
            color: #f5ee30;
            font-weight: bold;
        }
        
        .nav input {
            float: right;
            margin: 35px 50px 0 0;
            width: 200px;
            height: 30px;
            border: none;
            font-size: 12px;
            color: #cccccc;
            padding-left: 10px;
        }
        
        .banner h2 {
            font: 18px/40px "隶书";
            color: #303131;
        }
    </style>
</head>

<body>
    <div class="all">
        <div class="header">

        </div>
        <div class="nav">
            <ul>
                <li><a href="#">首页</a></li>
                <li><a href="#">用户中心</a></li>
                <li><a href="#">公司简介</a></li>
                <li><a href="#">联系我们</a></li>
                <li><a href="#">产品介绍</a></li>
            </ul>
            <input type="text" value="输入关键词">
        </div>
        <div class="banner">
            <h2>原木时尚>></h2>
            <img src="images/banner.jpg" alt="焦点图片">
        </div>
    </div>
</body>

</html>
