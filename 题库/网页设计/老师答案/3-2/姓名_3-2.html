<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: "微软雅黑";
        }
        
        .content {
            width: 980px;
            margin: 0 auto;
            height: 442px;
            background: url(images/xinshang.jpg) no-repeat;
        }
        /* .content img {
            margin: 150px 0 0 70px;
            border-radius: 10px;
        }
        
        .content img:hover {
            transform: scale(1.1);
        } */
        
        .box {
            margin: 150px 0 0 70px;
            border-radius: 10px;
            width: 156px;
            height: 237px;
            overflow: hidden;
            float: left;
        }
        
        .content img:hover {
            transform: scale(1.5);
        }
        
        .footer {
            line-height: 80px;
            background: url(images/footer_bg.jpg);
            color: #fff;
            text-align: center;
            margin-top: 20px;
        }
        
        .tree {
            position: fixed;
            right: 0;
            bottom: 0;
        }
        
        .tree span {
            display: none;
            width: 20px;
            line-height: 20px;
            background: #6CC;
            border-radius: 50%;
            text-align: center;
            opacity: 0.5;
            position: absolute;
            right: 0;
            top: 0;
        }
        
        .tree:hover span {
            display: block;
        }
    </style>
</head>

<body>
    <div class="content">
        <div class="box">
            <img src="images/img1.jpg" alt="">
        </div>
        <div class="box">
            <img src="images/img2.jpg" alt="">
        </div>
        <div class="box">
            <img src="images/img3.jpg" alt="">
        </div>
        <div class="box">
            <img src="images/img4.jpg" alt="">
        </div>
        <!-- <img src="images/img2.jpg" alt="">
        <img src="images/img3.jpg" alt="">
        <img src="images/img4.jpg" alt=""> -->
    </div>
    <div class="footer">
        青春树版权所有2000-2016京ICP备08001421号 京公网安备110108007702
    </div>
    <div class="tree">
        <img src="images/erweima.png" alt="">
        <span>x</span>
    </div>
    <script>
        var tree = document.querySelector('.tree');
        var span = tree.querySelector('span');
        span.onclick = function() {
            tree.style.display = 'none'
        }
    </script>
</body>

</html>
