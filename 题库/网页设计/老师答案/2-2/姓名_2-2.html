<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }
        
        .all {
            width: 980px;
            margin: 0 auto;
            font-family: "隶书";
        }
        
        h2 {
            color: #7c251c;
            font-size: 30px;
            text-align: center;
            margin-top: 20px;
        }
        
        h3 {
            color: #7c251c;
            font-size: 20px;
            text-align: center;
            margin-bottom: 20px;
        }
        
        .content {
            padding: 40px 0;
            border-top: 2px solid #dcdcdc;
            border-bottom: 2px solid #dcdcdc;
            font-size: 20px;
            color: #303131;
            text-indent: 2em;
        }
        
        .s01 {
            font-size: 30px;
            color: #7c251c;
            font-style: italic;
        }
        
        .s02 {
            color: #7c251c;
            font-weight: bold;
        }
        
        .s03 {
            font-size: 24px;
            color: #7c251c;
            font-style: italic;
            text-decoration: underline;
        }
        
        .s04 {
            background: #f5ee30;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div class="all">
        <h2>檀木简介</h2>
        <h3>TAN MU JIAN JIE</h3>
        <div class="content">
            <p><span class="s01">檀</span>,梵语是布施的意思，因其木质坚硬，香气芬芳永恒，色彩绚丽多变且百毒不侵，万古不朽，又能避邪，故又称<span class="s02">圣檀</span>。</p>
            <p>世界上仅存有<span class="s03">沈檀、檀香、绿檀、紫檀、黑檀、红檀、金药檀</span>等，而且数量极其有限。其质地紧密坚硬、色彩绚丽多变、香气芬芳永恒，且百毒不侵，又能避邪治病，所以人们常常把它作为<span class="s04">吉祥物</span>，以保平安吉祥。</p>
        </div>
        <h2>新品发布</h2>
        <h3>XIN PIN FA BU</h3>
        <img src="images/pic01.jpg" alt="" title="新品发布图片">
        <h2>高端原创</h2>
        <h3>GAO DUAN YUAN CHUANG</h3>
        <img src="images/pic02.jpg" alt="高端原创图片">
        <!-- title表示鼠标悬停在图片上显示的提示信息
        alt表示图片不能正常显示时，提示信息。 -->
    </div>
</body>

</html>
