<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }
        
        .w {
            width: 980px;
            margin: 0 auto;
        }
        
        .header {
            height: 55px;
            padding: 10px 0;
        }
        
        .header p {
            float: right;
        }
        
        .header a {
            color: #ff9900;
            margin-right: 40px;
            text-decoration: none;
            font-size: 18px;
            line-height: 55px;
        }
        
        .nav {
            height: 50px;
            background: #ff9900;
        }
        
        .nav li {
            float: left;
            list-style: none;
        }
        
        .nav a {
            padding: 0 30px;
            color: #9c5132;
            text-decoration: none;
            line-height: 50px;
        }
        
        .nav a:hover {
            color: #fff;
        }
        
        .banner img {
            height: 494px;
            width: 100%;
            /* overflow: hidden; */
        }
        
        .poster {
            position: absolute;
            top: 150px;
            right: 50px;
        }
    </style>
</head>

<body>
    <div class="header w">
        <img src="images/logo.jpg" alt="">
        <p>
            <a href="#">登录</a>
            <a href="#">注册</a>
        </p>
    </div>
    <div class="nav">
        <ul class="w">
            <li><a href="#">首页</a></li>
            <li><a href="#">公司简介</a></li>
            <li><a href="#">美食甜品</a></li>
            <li><a href="#">用户留言</a></li>
            <li><a href="#">联系我们</a></li>
        </ul>
    </div>
    <div class="banner">
        <img src="images/banner.jpg" alt="">
    </div>
    <div class="poster">
        <img src="images/poster.jpg" alt="">
    </div>
    <script>
        var poster = document.querySelector('.poster');
        var timer = setTimeout(function() {
            poster.style.display = 'none'
        }, 5000)
    </script>
</body>

</html>
