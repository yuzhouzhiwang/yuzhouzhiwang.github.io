# ============================================================
# 时光 · 硬件基础打卡计划 · 云端数据库每日自动更新
# 每天北京时间 07:25（UTC 23:25）运行
# 更新 /plan/data.js：版本号 +1、更新时间、当前阶段（金九银十/金三银四）
# ============================================================
name: Plan DB Daily Update

on:
  schedule:
    # UTC 23:25 = 北京时间次日 07:25
    - cron: '25 23 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-plan-db:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Update plan database
        run: python plan/update_db.py

      - name: Commit & push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore(plan): 每日07:25自动更新打卡计划云端数据库 [skip ci]'
          commit_user_name: 'shiguang-bot'
          commit_user_email: 'shiguang-bot@users.noreply.github.com'
