<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>电赛历年真题 × 三大电子 公司化筛选</title>
<style>
  :root{
    --bg:#f3f5f8; --card:#ffffff; --line:#e2e8f0; --ink:#1e293b; --muted:#64748b;
    --blue:#2563eb; --blue-bg:#eff6ff;
    --c-consumer:#2563eb; --c-consumer-bg:#dbeafe;
    --c-industrial:#ea580c; --c-industrial-bg:#ffedd5;
    --c-automotive:#059669; --c-automotive-bg:#d1fae5;
    --c-cross:#7c3aed; --c-cross-bg:#ede9fe;
    --c-circuit:#0f766e; --c-circuit-bg:#ccfbf1;
    --p1:#dc2626; --p1-bg:#fee2e2; --p2:#d97706; --p2-bg:#fef3c7; --p3:#64748b; --p3-bg:#e2e8f0;
    --radius:12px; --shadow:0 1px 2px rgba(15,23,42,.06),0 8px 24px -12px rgba(15,23,42,.12);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{font-family:"Microsoft YaHei","PingFang SC","Noto Sans SC",system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;font-size:14px}
  .wrap{max-width:1200px;margin:0 auto;padding:0 20px}
  a{color:var(--blue);text-decoration:none}
  a:hover{text-decoration:underline}

  /* ===== 顶部导航 ===== */
  .topnav{position:sticky;top:0;z-index:100;background:#0f172a;box-shadow:0 1px 0 rgba(255,255,255,.08)}
  .nav-inner{display:flex;align-items:center;gap:18px;height:52px;flex-wrap:wrap}
  .brand{font-size:14.5px;font-weight:700;color:#fff;white-space:nowrap}
  .brand:hover{text-decoration:none}
  .brand span{color:#7dd3fc}
  .nav-links{display:flex;gap:2px;flex-wrap:wrap}
  .nav-links a{color:#cbd5e1;font-size:13px;padding:6px 11px;border-radius:8px;white-space:nowrap}
  .nav-links a:hover{color:#fff;background:rgba(255,255,255,.08);text-decoration:none}
  .nav-links a.active{color:#fff;background:rgba(255,255,255,.14);font-weight:600}
  @media (max-width:820px){ .nav-inner{height:auto;padding:8px 0} .nav-links{width:100%} }
  .nav-out{color:#7dd3fc;font-size:13px;padding:6px 11px;border-radius:8px;white-space:nowrap;border:1px solid rgba(125,211,252,.35)}
  .nav-out:hover{color:#fff;background:rgba(125,211,252,.12);text-decoration:none}

  /* ===== 视图切换 ===== */
  .view{display:none}
  .view.active{display:block}

  /* ===== Hero ===== */
  header.hero{background:linear-gradient(135deg,#0f172a 0%,#1e293b 60%,#334155 100%);color:#e2e8f0;padding:30px 0 26px}
  header.hero .kicker{font-size:12px;letter-spacing:.14em;color:#93c5fd;text-transform:uppercase;margin-bottom:6px}
  header.hero h1{font-size:24px;font-weight:800;color:#fff}
  header.hero .sub{margin-top:8px;color:#94a3b8;font-size:13px;max-width:920px}
  .tagline-dots{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
  .tagline-dots span{font-size:12px;padding:3px 10px;border-radius:999px;border:1px solid rgba(255,255,255,.25);color:#cbd5e1}

  /* ===== 子页头 ===== */
  .view-head{padding:26px 0 6px}
  .view-head h2{font-size:22px;font-weight:800}
  .view-head p{color:var(--muted);font-size:13px;margin-top:6px;max-width:900px}

  /* ===== 统计卡片 ===== */
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:20px 0 0}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px}
  .stat .num{font-size:30px;font-weight:800;line-height:1.1}
  .stat .lab{font-size:12.5px;color:var(--muted);margin-top:4px}
  .stat .num small{font-size:15px;font-weight:600;color:var(--muted)}
  .stat.blue .num{color:var(--blue)}

  /* ===== 卡片容器 ===== */
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin-top:18px}
  .sec-title{font-size:16px;font-weight:700;margin-bottom:4px}
  .sec-sub{font-size:12.5px;color:var(--muted);margin-bottom:14px}
  .charts{display:grid;grid-template-columns:1.7fr 1fr;gap:18px}
  .chart-box{width:100%;height:360px}

  /* ===== 行业入口卡片 ===== */
  .entry-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:18px}
  .entry{border-radius:var(--radius);padding:16px 18px;border:1px solid var(--line);background:var(--card);box-shadow:var(--shadow);cursor:pointer;transition:transform .12s, box-shadow .12s;display:block;color:inherit}
  .entry:hover{transform:translateY(-2px);box-shadow:0 12px 28px -14px rgba(15,23,42,.25);text-decoration:none}
  .entry h3{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
  .entry .dot{width:10px;height:10px;border-radius:50%;display:inline-block}
  .entry .n{font-size:24px;font-weight:800;margin:6px 0 2px}
  .entry p{font-size:12.5px;color:var(--muted)}
  .entry .go{margin-top:10px;font-size:12.5px;font-weight:700;color:var(--blue)}
  .entry.full{grid-column:span 3;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
  .entry.full .n{margin:0}

  /* ===== 动手顺序（纵向步骤） ===== */
  .steps-v{display:flex;flex-direction:column;gap:10px;margin-top:6px}
  .stepv{display:flex;gap:14px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
  .stepv .no{width:30px;height:30px;border-radius:50%;flex:0 0 30px;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:14px}
  .stepv .bd{flex:1}
  .stepv .tt{font-size:14px;font-weight:700}
  .stepv .tt .code{color:var(--blue);margin-right:6px}
  .stepv .wh{font-size:12.5px;color:var(--muted);margin-top:1px}
  .stepv .ln{font-size:12.5px;margin-top:3px;color:#475569}
  .stepv .ln b{color:var(--ink)}

  /* ===== 筛选 ===== */
  .filters{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:14px}
  .filters .grp{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .filters .glab{font-size:12px;color:var(--muted);margin-right:2px}
  .search{flex:1;min-width:200px}
  .search input{width:100%;padding:8px 12px;border:1px solid var(--line);border-radius:8px;font-size:13px;outline:none;background:#fff}
  .search input:focus{border-color:var(--blue)}
  .chip{cursor:pointer;user-select:none;font-size:12.5px;padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--ink);transition:all .15s}
  .chip:hover{border-color:#94a3b8}
  .chip.on{color:#fff;border-color:transparent}
  .chip.s-consumer.on{background:var(--c-consumer)}
  .chip.s-industrial.on{background:var(--c-industrial)}
  .chip.s-automotive.on{background:var(--c-automotive)}
  .chip.s-cross.on{background:var(--c-cross)}
  .chip.p-all.on{background:#334155}
  .chip.p-1.on{background:var(--p1)}
  .chip.p-2.on{background:var(--p2)}
  .chip.p-3.on{background:var(--p3)}
  .cnt{font-size:12px;color:var(--muted)}

  /* ===== 表格 + 分页 ===== */
  .tbl-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
  table{width:100%;border-collapse:collapse;font-size:13px;min-width:980px}
  thead th{background:#f8fafc;text-align:left;padding:10px 12px;font-size:12.5px;color:#475569;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0}
  thead th[data-k]{cursor:pointer;user-select:none}
  thead th[data-k]:hover{color:var(--blue)}
  thead th .arr{font-size:10px;color:#94a3b8}
  tbody td{padding:9px 12px;border-bottom:1px solid #f1f5f9;vertical-align:top}
  tbody tr:hover{background:#f8fafc}
  tbody tr:last-child td{border-bottom:none}
  td.year{white-space:nowrap;font-weight:600;color:#475569}
  td.code{white-space:nowrap;font-weight:700;color:var(--blue)}
  td.t{min-width:220px;font-weight:600}
  td.scene{color:#475569;min-width:280px}
  .tags{display:flex;gap:4px;flex-wrap:wrap}
  .tag{font-size:11.5px;padding:1px 8px;border-radius:999px;font-weight:600;white-space:nowrap}
  .tag.t-consumer{color:var(--c-consumer);background:var(--c-consumer-bg)}
  .tag.t-industrial{color:var(--c-industrial);background:var(--c-industrial-bg)}
  .tag.t-automotive{color:var(--c-automotive);background:var(--c-automotive-bg)}
  .pri{font-size:11.5px;padding:1px 9px;border-radius:999px;font-weight:600;white-space:nowrap}
  .pri.p-1{color:var(--p1);background:var(--p1-bg)}
  .pri.p-2{color:var(--p2);background:var(--p2-bg)}
  .pri.p-3{color:var(--p3);background:var(--p3-bg)}
  .note{font-size:11.5px;color:var(--muted)}
  .pager{display:flex;gap:6px;align-items:center;justify-content:center;margin-top:14px;flex-wrap:wrap}
  .pager button{font-size:12.5px;padding:5px 11px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer;color:var(--ink)}
  .pager button:hover{border-color:#94a3b8}
  .pager button.on{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
  .pager button:disabled{opacity:.4;cursor:not-allowed}
  .pager .pi{color:var(--muted);font-size:12px}

  /* ===== 电路知识库 ===== */
  .cat-chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
  .cat-chips .chip.cat-on{background:#334155}
  .circ-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
  .circ{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:13px 15px}
  .circ h4{font-size:14px;font-weight:700}
  .circ .row{font-size:12.5px;margin-top:5px;color:#475569}
  .circ .row b{color:var(--ink)}
  .circ .row .tt2{color:var(--blue);font-weight:600}
  .lv{display:inline-block;font-size:11px;font-weight:600;padding:2px 9px;border-radius:999px;margin-left:8px;vertical-align:1px}
  .lv-入门{background:#dcfce7;color:#15803d}
  .lv-进阶{background:#ffedd5;color:#b45309}
  .lv-挑战{background:#fee2e2;color:#dc2626}
  /* ===== TI·ADI 方案 ===== */
  .tiadi{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:12px}
  .tiadi h4{font-size:14.5px;font-weight:700;margin-bottom:10px}
  .tiadi .cols{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
  .tiadi .col{font-size:12.5px;line-height:1.6;color:#475569;padding:10px 12px;border-radius:8px}
  .tiadi .col.ti{background:#eff6ff;border:1px solid #dbeafe}
  .tiadi .col.adi{background:#fef3f2;border:1px solid #fde5e0}
  .tiadi .col .vh{font-size:12px;font-weight:700;margin-bottom:5px}
  .tiadi .col.ti .vh{color:var(--blue)}
  .tiadi .col.adi .vh{color:#c2410c}
  .tiadi .st{font-size:12.5px;color:#475569}
  .tiadi .st b{color:var(--ink)}
  .tiadi .st ol{margin:6px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px}
  .tiadi .st li{display:flex;gap:8px;align-items:baseline}
  .tiadi .st li .no{flex:none;width:17px;height:17px;border-radius:50%;background:#1d4ed8;color:#fff;font-size:10.5px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;transform:translateY(1px)}
  .comp-wrap{margin-top:20px}
  .comp-table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:760px}
  .comp-table th{background:#f8fafc;text-align:left;padding:8px 10px;font-size:12px;color:#475569;border-bottom:1px solid var(--line);position:sticky;top:0}
  .comp-table td{padding:7px 10px;border-bottom:1px solid #f1f5f9;vertical-align:top}
  .comp-table tr:hover{background:#f8fafc}
  .comp-group{font-weight:700;background:#f1f5f9}

  footer{margin:26px 0 40px;text-align:center;font-size:12px;color:var(--muted)}
  footer a{color:var(--blue);text-decoration:none}
  .fallback{display:none;padding:24px;text-align:center;color:var(--muted);font-size:13px;border:1px dashed var(--line);border-radius:10px}

  @media (max-width:900px){
    body{font-size:15px}
    .stats{grid-template-columns:repeat(2,1fr)}
    .charts{grid-template-columns:1fr}
    .entry-grid{grid-template-columns:1fr}
    .entry.full{grid-column:span 1}
    .circ-grid{grid-template-columns:1fr}
    .tiadi .cols{grid-template-columns:1fr}
    .tiadi h4 .tt2{float:none !important;display:block;margin-top:4px}
    header.hero h1{font-size:21px}
    header.hero .sub{font-size:14px}
    .sec-sub,.stat .lab,.entry p,.stepv .wh,.filters .glab{font-size:13px}
    .search input{font-size:16px}
  }
</style>
</head>
