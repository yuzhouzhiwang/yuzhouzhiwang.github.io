<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>电赛历年真题 × 三大电子 公司化筛选</title>
<style>
  :root{
    --bg:#f3f5f8; --card:#ffffff; --line:#e2e8f0; --ink:#1e293b; --muted:#64748b;
    --blue:#2563eb; --blue-bg:#eff6ff;
    --c-consumer:#2563eb; --c-consumer-bg:#dbeafe;
    --c-industrial:#ea580c; --c-industrial-bg:#ffedd5;
    --c-automotive:#059669; --c-automotive-bg:#d1fae5;
    --c-cross:#7c3aed; --c-cross-bg:#ede9fe;
    --c-circuit:#0f766e; --c-circuit-bg:#ccfbf1;
    --p1:#dc2626; --p1-bg:#fee2e2; --p2:#d97706; --p2-bg:#fef3c7; --p3:#64748b; --p3-bg:#e2e8f0;
    --radius:12px; --shadow:0 1px 2px rgba(15,23,42,.06),0 8px 24px -12px rgba(15,23,42,.12);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{font-family:"Microsoft YaHei","PingFang SC","Noto Sans SC",system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;font-size:14px}
  .wrap{max-width:1200px;margin:0 auto;padding:0 20px}
  a{color:var(--blue);text-decoration:none}
  a:hover{text-decoration:underline}

  /* ===== 顶部导航 ===== */
  .topnav{position:sticky;top:0;z-index:100;background:#0f172a;box-shadow:0 1px 0 rgba(255,255,255,.08)}
  .nav-inner{display:flex;align-items:center;gap:18px;height:52px;flex-wrap:wrap}
  .brand{font-size:14.5px;font-weight:700;color:#fff;white-space:nowrap}
  .brand:hover{text-decoration:none}
  .brand span{color:#7dd3fc}
  .nav-links{display:flex;gap:2px;flex-wrap:wrap}
  .nav-links a{color:#cbd5e1;font-size:13px;padding:6px 11px;border-radius:8px;white-space:nowrap}
  .nav-links a:hover{color:#fff;background:rgba(255,255,255,.08);text-decoration:none}
  .nav-links a.active{color:#fff;background:rgba(255,255,255,.14);font-weight:600}
  @media (max-width:820px){ .nav-inner{height:auto;padding:8px 0} .nav-links{width:100%} }
  .home-nav{margin-left:auto;color:#7dd3fc;font-size:13px;font-weight:700;white-space:nowrap;text-decoration:none}
  .home-nav:hover{text-decoration:underline;color:#93c5fd}
  @media (max-width:820px){ .home-nav{margin-left:0} }

  /* ===== 视图切换 ===== */
  .view{display:none}
  .view.active{display:block}

  /* ===== Hero ===== */
  header.hero{background:linear-gradient(135deg,#0f172a 0%,#1e293b 60%,#334155 100%);color:#e2e8f0;padding:30px 0 26px}
  header.hero .kicker{font-size:12px;letter-spacing:.14em;color:#93c5fd;text-transform:uppercase;margin-bottom:6px}
  header.hero h1{font-size:24px;font-weight:800;color:#fff}
  header.hero .sub{margin-top:8px;color:#94a3b8;font-size:13px;max-width:920px}
  .tagline-dots{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
  .tagline-dots span{font-size:12px;padding:3px 10px;border-radius:999px;border:1px solid rgba(255,255,255,.25);color:#cbd5e1}

  /* ===== 子页头 ===== */
  .view-head{padding:26px 0 6px}
  .view-head h2{font-size:22px;font-weight:800}
  .view-head p{color:var(--muted);font-size:13px;margin-top:6px;max-width:900px}

  /* ===== 统计卡片 ===== */
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:20px 0 0}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px}
  .stat .num{font-size:30px;font-weight:800;line-height:1.1}
  .stat .lab{font-size:12.5px;color:var(--muted);margin-top:4px}
  .stat .num small{font-size:15px;font-weight:600;color:var(--muted)}
  .stat.blue .num{color:var(--blue)}

  /* ===== 卡片容器 ===== */
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin-top:18px}
  .sec-title{font-size:16px;font-weight:700;margin-bottom:4px}
  .sec-sub{font-size:12.5px;color:var(--muted);margin-bottom:14px}
  .charts{display:grid;grid-template-columns:1.7fr 1fr;gap:18px}
  .chart-box{width:100%;height:360px}

  /* ===== 行业入口卡片 ===== */
  .entry-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:18px}
  .entry{border-radius:var(--radius);padding:16px 18px;border:1px solid var(--line);background:var(--card);box-shadow:var(--shadow);cursor:pointer;transition:transform .12s, box-shadow .12s;display:block;color:inherit}
  .entry:hover{transform:translateY(-2px);box-shadow:0 12px 28px -14px rgba(15,23,42,.25);text-decoration:none}
  .entry h3{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
  .entry .dot{width:10px;height:10px;border-radius:50%;display:inline-block}
  .entry .n{font-size:24px;font-weight:800;margin:6px 0 2px}
  .entry p{font-size:12.5px;color:var(--muted)}
  .entry .go{margin-top:10px;font-size:12.5px;font-weight:700;color:var(--blue)}
  .entry.full{grid-column:span 3;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
  .entry.full .n{margin:0}

  /* ===== 动手顺序（纵向步骤） ===== */
  .steps-v{display:flex;flex-direction:column;gap:10px;margin-top:6px}
  .stepv{display:flex;gap:14px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
  .stepv .no{width:30px;height:30px;border-radius:50%;flex:0 0 30px;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:14px}
  .stepv .bd{flex:1}
  .stepv .tt{font-size:14px;font-weight:700}
  .stepv .tt .code{color:var(--blue);margin-right:6px}
  .stepv .wh{font-size:12.5px;color:var(--muted);margin-top:1px}
  .stepv .ln{font-size:12.5px;margin-top:3px;color:#475569}
  .stepv .ln b{color:var(--ink)}

  /* ===== 筛选 ===== */
  .filters{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:14px}
  .filters .grp{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .filters .glab{font-size:12px;color:var(--muted);margin-right:2px}
  .search{flex:1;min-width:200px}
  .search input{width:100%;padding:8px 12px;border:1px solid var(--line);border-radius:8px;font-size:13px;outline:none;background:#fff}
  .search input:focus{border-color:var(--blue)}
  .chip{cursor:pointer;user-select:none;font-size:12.5px;padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--ink);transition:all .15s}
  .chip:hover{border-color:#94a3b8}
  .chip.on{color:#fff;border-color:transparent}
  .chip.s-consumer.on{background:var(--c-consumer)}
  .chip.s-industrial.on{background:var(--c-industrial)}
  .chip.s-automotive.on{background:var(--c-automotive)}
  .chip.s-cross.on{background:var(--c-cross)}
  .chip.p-all.on{background:#334155}
  .chip.p-1.on{background:var(--p1)}
  .chip.p-2.on{background:var(--p2)}
  .chip.p-3.on{background:var(--p3)}
  .cnt{font-size:12px;color:var(--muted)}

  /* ===== 表格 + 分页 ===== */
  .tbl-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
  table{width:100%;border-collapse:collapse;font-size:13px;min-width:980px}
  thead th{background:#f8fafc;text-align:left;padding:10px 12px;font-size:12.5px;color:#475569;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0}
  thead th[data-k]{cursor:pointer;user-select:none}
  thead th[data-k]:hover{color:var(--blue)}
  thead th .arr{font-size:10px;color:#94a3b8}
  tbody td{padding:9px 12px;border-bottom:1px solid #f1f5f9;vertical-align:top}
  tbody tr:hover{background:#f8fafc}
  tbody tr:last-child td{border-bottom:none}
  td.year{white-space:nowrap;font-weight:600;color:#475569}
  td.code{white-space:nowrap;font-weight:700;color:var(--blue)}
  td.t{min-width:220px;font-weight:600}
  td.scene{color:#475569;min-width:280px}
  .tags{display:flex;gap:4px;flex-wrap:wrap}
  .tag{font-size:11.5px;padding:1px 8px;border-radius:999px;font-weight:600;white-space:nowrap}
  .tag.t-consumer{color:var(--c-consumer);background:var(--c-consumer-bg)}
  .tag.t-industrial{color:var(--c-industrial);background:var(--c-industrial-bg)}
  .tag.t-automotive{color:var(--c-automotive);background:var(--c-automotive-bg)}
  .pri{font-size:11.5px;padding:1px 9px;border-radius:999px;font-weight:600;white-space:nowrap}
  .pri.p-1{color:var(--p1);background:var(--p1-bg)}
  .pri.p-2{color:var(--p2);background:var(--p2-bg)}
  .pri.p-3{color:var(--p3);background:var(--p3-bg)}
  .note{font-size:11.5px;color:var(--muted)}
  .pdf-td{white-space:nowrap}
  .pdf-td a{display:inline-block;font-size:12px;color:var(--blue);margin-right:8px;white-space:nowrap}
  .pdf-td a:hover{text-decoration:underline}
  .pdf-a{display:inline-block;margin-left:8px;font-size:12px;color:var(--blue);border:1px solid #bfdbfe;border-radius:6px;padding:1px 8px;white-space:nowrap}
  .pdf-a-grp{margin-left:8px;white-space:nowrap;display:inline-block;vertical-align:middle}
  .pdf-a-grp .pdf-a{margin-left:0;margin-right:6px}
  .pdf-a:hover{background:var(--blue-bg);text-decoration:none}
  .pager{display:flex;gap:6px;align-items:center;justify-content:center;margin-top:14px;flex-wrap:wrap}
  .pager button{font-size:12.5px;padding:5px 11px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer;color:var(--ink)}
  .pager button:hover{border-color:#94a3b8}
  .pager button.on{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
  .pager button:disabled{opacity:.4;cursor:not-allowed}
  .pager .pi{color:var(--muted);font-size:12px}

  /* ===== 电路知识库 ===== */
  .cat-chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
  .cat-chips .chip.cat-on{background:#334155}
  .circ-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
  .circ{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:13px 15px}
  .circ h4{font-size:14px;font-weight:700}
  .circ .row{font-size:12.5px;margin-top:5px;color:#475569}
  .circ .row b{color:var(--ink)}
  .circ .row .tt2{color:var(--blue);font-weight:600}
  .lv{display:inline-block;font-size:11px;font-weight:600;padding:2px 9px;border-radius:999px;margin-left:8px;vertical-align:1px}
  .lv-入门{background:#dcfce7;color:#15803d}
  .lv-进阶{background:#ffedd5;color:#b45309}
  .lv-挑战{background:#fee2e2;color:#dc2626}
  /* ===== TI·ADI 方案 ===== */
  .tiadi{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:12px}
  .tiadi h4{font-size:14.5px;font-weight:700;margin-bottom:10px}
  .tiadi .cols{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
  .tiadi .col{font-size:12.5px;line-height:1.6;color:#475569;padding:10px 12px;border-radius:8px}
  .tiadi .col.ti{background:#eff6ff;border:1px solid #dbeafe}
  .tiadi .col.adi{background:#fef3f2;border:1px solid #fde5e0}
  .tiadi .col .vh{font-size:12px;font-weight:700;margin-bottom:5px}
  .tiadi .col.ti .vh{color:var(--blue)}
  .tiadi .col.adi .vh{color:#c2410c}
  .tiadi .st{font-size:12.5px;color:#475569}
  .tiadi .st b{color:var(--ink)}
  .tiadi .st ol{margin:6px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px}
  .tiadi .st li{display:flex;gap:8px;align-items:baseline}
  .tiadi .st li .no{flex:none;width:17px;height:17px;border-radius:50%;background:#1d4ed8;color:#fff;font-size:10.5px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;transform:translateY(1px)}
  .comp-wrap{margin-top:20px}
  .comp-table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:760px}
  .comp-table th{background:#f8fafc;text-align:left;padding:8px 10px;font-size:12px;color:#475569;border-bottom:1px solid var(--line);position:sticky;top:0}
  .comp-table td{padding:7px 10px;border-bottom:1px solid #f1f5f9;vertical-align:top}
  .comp-table tr:hover{background:#f8fafc}
  .comp-group{font-weight:700;background:#f1f5f9}

  footer{margin:26px 0 40px;text-align:center;font-size:12px;color:var(--muted)}
  footer a{color:var(--blue);text-decoration:none}
  .fallback{display:none;padding:24px;text-align:center;color:var(--muted);font-size:13px;border:1px dashed var(--line);border-radius:10px}

  @media (max-width:900px){
    body{font-size:15px}
    .stats{grid-template-columns:repeat(2,1fr)}
    .charts{grid-template-columns:1fr}
    .entry-grid{grid-template-columns:1fr}
    .entry.full{grid-column:span 1}
    .circ-grid{grid-template-columns:1fr}
    .tiadi .cols{grid-template-columns:1fr}
    .tiadi h4 .tt2{float:none !important;display:block;margin-top:4px}
    header.hero h1{font-size:21px}
    header.hero .sub{font-size:14px}
    .sec-sub,.stat .lab,.entry p,.stepv .wh,.filters .glab{font-size:13px}
    .search input{font-size:16px}
  }
</style>
</head>

    return String(s == null ? "" : s)
      .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
  }

  /* ================= 路由 ================= */
  var VIEW_IDS = ["home","focus40","consumer","industrial","automotive","cross","basic","tiadi","circuits"];
  var inited = {};
  function route(){
    var h = (location.hash || "").replace(/^#\//, "");
    var v = VIEW_IDS.indexOf(h) >= 0 ? h : "home";
    VIEW_IDS.forEach(function(id){
      var el = $id("view-" + id);

  function initView(v){
    if(v === "home"){ renderHome(); initHomeCharts(); }
    else if(v === "focus40"){ renderFocus40(); initFocus40Charts(); }
    else if(v === "consumer" || v === "industrial" || v === "automotive"){ renderIndustry(v); }
    else if(v === "cross"){ renderCross(); initCrossCharts(); }
    else if(v === "basic"){ renderBasic(); initBasicCharts(); }

  /* ================= 通用清单组件（搜索/筛选/排序/分页） ================= */
  function buildList(conf){
    // conf: {id, data, sectors: null(不显示领域筛选) | {消费:1,工业:1,车规:1}, pageSize:10}
    var st = {q:"", p:"all", sortKey:"year", sortDir:-1, page:1};
    if(conf.sectors) st.sec = {消费:1, 工业:1, 车规:1};
    var root = $id(conf.id);
    var ps = conf.pageSize || 10;

    function match(t){
      if(st.q && t.title.indexOf(st.q) < 0 && t.scene.indexOf(st.q) < 0) return false;
      if(st.p !== "all" && t.priority !== parseInt(st.p, 10)) return false;
      if(st.sec){
        var hit = false;
        t.sectors.forEach(function(s){ if(st.sec[s]) hit = true; });
        if(!hit) return false;
      }
      return true;
    }
    function yearVal(t){ var n = parseInt(t.year, 10); return isNaN(n) ? 0 : n; }
    function codeVal(t){ if(t.code === "合集") return 999; var n = parseInt(t.code, 10); return isNaN(n) ? 999 : n; }
    function sorted(list){
      var k = st.sortKey, dir = st.sortDir;
      return list.slice().sort(function(a,b){
        var va, vb;
        if(k === "year"){ va = yearVal(a); vb = yearVal(b); }
        else if(k === "code"){ va = codeVal(a); vb = codeVal(b); }
        else if(k === "pri"){ va = a.priority; vb = b.priority; }
        else { va = a.title; vb = b.title; }
        if(va < vb) return -1 * dir;
        if(va > vb) return 1 * dir;
        return 0;
      });
    }
    function render(){
      var list = sorted(conf.data.filter(match));
      var total = list.length, pc = Math.max(1, Math.ceil(total / ps));
      if(st.page > pc) st.page = pc;
      var start = (st.page - 1) * ps, slice = list.slice(start, start + ps);
      var html = "";
      slice.forEach(function(t){
        var pm = PDFMAP[t.year + "-" + t.code];
        var pdfTd = pm
          ? '<td class="pdf-td"><a href="' + previewHref(pm) + '" target="_blank" rel="noopener" title="' + (isLocal ? '本地文件：' : '网页预览：') + esc(pm.file) + '">' + (isLocal ? '本地' : '预览') + '</a><a href="' + pm.gh_blob + '" target="_blank" rel="noopener" title="GitHub 在线：' + esc(pm.file) + '">GitHub</a><a href="' + SRC_URL + '" target="_blank" rel="noopener" title="原站直达：zuoliangyu.github.io/NUEDC_TOPIC">原站</a></td>'
          : '<td class="pdf-td">—</td>';
        var tags = t.sectors.map(function(s){
          return '<span class="tag ' + SEC_INFO[s].cls + '">' + SEC_INFO[s].label + '</span>';
        }).join("");
        html += "<tr>" +
          '<td class="year">' + esc(t.year) + '</td>' +
          '<td class="code">' + esc(t.code) + '</td>' +
          '<td class="t">' + esc(t.title) + '</td>' +
          '<td><div class="tags">' + tags + '</div></td>' +
          '<td class="scene">' + esc(t.scene) + '</td>' +
          '<td><span class="pri p-' + t.priority + '">' + PRI_LABEL[t.priority] + '</span></td>' +
          '<td class="note">' + esc(t.note || "") + '</td>' +
          pdfTd +
        "</tr>";
      });
      tbody.innerHTML = html || '<tr><td colspan="8" style="text-align:center;color:#94a3b8;padding:22px">没有符合条件的题目</td></tr>';
      cnt.textContent = "显示 " + total + " / " + conf.data.length + " 条";
      var ph = "";
      function btn(label, pg, dis, on){
        ph += '<button' + (dis ? ' disabled' : '') + (on ? ' class="on"' : '') + ' data-pg="' + pg + '">' + label + '</button>';
      }
      btn("«", 1, st.page === 1, false);
      btn("‹", st.page - 1, st.page === 1, false);
      var from = Math.max(1, st.page - 3), to = Math.min(pc, st.page + 3);
      for(var i = from; i <= to; i++) btn(String(i), i, false, i === st.page);
      btn("›", st.page + 1, st.page === pc, false);
      btn("»", pc, st.page === pc, false);
      ph += '<span class="pi">第 ' + st.page + ' / ' + pc + ' 页</span>';
      pager.innerHTML = ph;
      Array.prototype.forEach.call(pager.querySelectorAll("button[data-pg]"), function(b){
        b.addEventListener("click", function(){
          if(!b.disabled){ st.page = parseInt(b.getAttribute("data-pg"), 10); render(); }
        });
      });
    }

    /* 构建外壳 */
    var chips = "";
    if(conf.sectors){
      chips = '<div class="grp"><span class="glab">领域</span>' +
        ['消费','工业','车规'].map(function(s){
          return '<span class="chip s-' + (s === "车规" ? "automotive" : s === "工业" ? "industrial" : "consumer") + ' on" data-f="' + s + '">' + SEC_INFO[s].label + '</span>';
        }).join("") + '</div>';
    }
    root.innerHTML =
      '<div class="filters">' +
        '<div class="search"><input type="text" placeholder="搜索题目 / 公司化场景关键词…"></div>' +
        chips +
        '<div class="grp"><span class="glab">优先级</span>' +
          '<span class="chip p-all on" data-p="all">全部</span>' +
          '<span class="chip p-1" data-p="1">重点推荐</span>' +
          '<span class="chip p-2" data-p="2">推荐</span>' +
          '<span class="chip p-3" data-p="3">参考</span>' +
        '</div>' +
        '<span class="cnt" style="margin-left:auto"></span>' +
      '</div>' +
      '<div class="tbl-scroll"><table><thead><tr>' +
        '<th data-k="year">年份 <span class="arr"></span></th>' +
        '<th data-k="code">题号</th>' +
        '<th data-k="title">题目</th>' +
        '<th>领域</th><th>公司化落地场景</th>' +
        '<th data-k="pri">优先级 <span class="arr"></span></th>' +
        '<th>真题原文</th>' +
        '<th>备注</th>' +
      '</tr></thead><tbody></tbody></table></div>' +
      '<div class="pager"></div>';

    var tbody = root.querySelector("tbody");
    var cnt = root.querySelector(".cnt");
    var pager = root.querySelector(".pager");
    root.querySelector(".search input").addEventListener("input", function(e){
      st.q = e.target.value.trim(); st.page = 1; render();
    });
    if(conf.sectors){
      Array.prototype.forEach.call(root.querySelectorAll(".filters .chip[data-f]"), function(ch){
        ch.addEventListener("click", function(){
          var s = ch.getAttribute("data-f");
          var active = Object.keys(st.sec).filter(function(k){ return st.sec[k]; }).length;
          if(st.sec[s] && active <= 1) return;
          st.sec[s] = st.sec[s] ? 0 : 1;
          ch.classList.toggle("on"); st.page = 1; render();
        });
      });
    }
    Array.prototype.forEach.call(root.querySelectorAll(".filters .chip[data-p]"), function(ch){
      ch.addEventListener("click", function(){
        Array.prototype.forEach.call(root.querySelectorAll(".filters .chip[data-p]"), function(x){ x.classList.remove("on"); });
        ch.classList.add("on");
        st.p = ch.getAttribute("data-p"); st.page = 1; render();
      });
    });
    Array.prototype.forEach.call(root.querySelectorAll("thead th[data-k]"), function(th){
      th.addEventListener("click", function(){
        var k = th.getAttribute("data-k");
        if(st.sortKey === k){ st.sortDir = -st.sortDir; }
        else { st.sortKey = k; st.sortDir = (k === "title") ? 1 : -1; }
        Array.prototype.forEach.call(root.querySelectorAll("thead th[data-k] .arr"), function(x){ x.textContent = ""; });
        th.querySelector(".arr").textContent = st.sortDir === -1 ? " ▼" : " ▲";
        render();
      });
    });
    render();
  }

  function focusTopic(code){
    var yc = code.split("-");
    for(var i = 0; i < T.length; i++){
      if(T[i].priority === 1 && T[i].year === yc[0] && T[i].code === yc[1]) return T[i];
    }
    return null;
  }
  function focusLearn(code){
    if(FOCUS_LEARN[code]) return FOCUS_LEARN[code];
    var mods = [];
    CIRC.forEach(function(c){
      if(c.topics && c.topics.indexOf(code) >= 0) mods.push(c.name);
    });
    return mods.slice(0, 2).join("、") || "见总览清单 / 电路知识库";
  }
  function renderFocus40(){
    var all = T.filter(function(t){ return t.priority === 1; });
    var groups = FOCUS_GROUPS.map(function(g){
      return {g:g, items:g.codes.map(function(code){ return focusTopic(code); }).filter(Boolean)};
    });
    var nPower = groups[0].items.length, nTest = groups[1].items.length;

        ch.classList.add("cat-on");
        renderTIADIList(ch.getAttribute("data-cat"));
      });
    });
  }
  function renderTIADIList(cat){
    var list = TIADI.filter(function(x){ return cat === "all" || x.cat === cat; });
    var html = list.map(function(c){
      var steps = c.steps.map(function(s, i){
        return '<li><span class="no">' + (i + 1) + '</span>' + esc(s) + '</li>';
      }).join("");
      return '<div class="tiadi">' +
        '<h4>' + esc(c.cat) + '<span class="tt2" style="float:right;font-weight:400">对应真题：' + esc(c.topics) + '</span></h4>' +
        '<div class="cols">' +
          '<div class="col ti"><div class="vh">TI 方案</div>' + esc(c.ti) + '</div>' +
          '<div class="col adi"><div class="vh">ADI 方案</div>' + esc(c.adi) + '</div>' +
        '</div>' +
        '<div class="st"><b>粗略解答步骤（电路选型思路）：</b><ol>' + steps + '</ol></div>' +
      '</div>';
    }).join("");
    $id("tiadi-list").innerHTML = html || '<p style="color:#94a3b8;padding:10px 0">该类别暂无方案</p>';
  }
  function initTIADICharts(){
    if(!window.echarts){ $id("fb6").style.display = "block"; return; }
    function cnt(s){ var n = (s.match(/\d{4}-[A-Z]|\d{4}/g) || []).length; return n; }
    var names = [], vals = [];
    TIADI.forEach(function(c){ names.push(c.cat); vals.push(cnt(c.topics)); });
    var c6 = echarts.init($id("chart6"));
    c6.setOption({
      backgroundColor:"transparent",
      tooltip:{trigger:"axis", triggerOn:"mousemove|click", renderMode:"richText", confine:true},
      grid:{left:6, right:40, top:10, bottom:0, containLabel:true},
      xAxis:{type:"value", minInterval:1, axisLabel:{fontSize:11, color:"#64748b"}, splitLine:{lineStyle:{color:"#eef2f7"}}},
      yAxis:{type:"category", data:names, axisLabel:{fontSize:11, color:"#334155"}, axisLine:{lineStyle:{color:"#cbd5e1"}}, axisTick:{show:false}},
      series:[{type:"bar", barWidth:12, itemStyle:{color:"#1d4ed8", borderRadius:[0,4,4,0]},
        label:{show:true, position:"right", fontSize:11, color:"#475569"},
        data: vals}]
    });
    window.addEventListener("resize", function(){ c6.resize(); });
  }

  /* ================= 视图：电路与元器件 ================= */
  function renderCircuits(){
    var cats = [];
    CIRC.forEach(function(c){ if(cats.indexOf(c.cat) < 0) cats.push(c.cat); });
    var chips = '<span class="chip cat-on" data-cat="all">全部（' + CIRC.length + '）</span>' +
      cats.map(function(c){
        return '<span class="chip" data-cat="' + c + '">' + c + '（' + CIRC.filter(function(x){ return x.cat === c; }).length + '）</span>';
      }).join("");
    $id("view-circuits").innerHTML =
      '<div class="view-head">' +
        '<div class="kicker" style="font-size:12px;letter-spacing:.14em;color:#0f766e;text-transform:uppercase;margin-bottom:4px">Circuits & Components</div>' +
        '<h2>电路与元器件 · 电赛真题背后的知识库</h2>' +
        '<p>' + CIRC.length + ' 个电路模块按六大类梳理（电源变换 / 信号与测量 / 控制与运动 / 射频与通信 / 显示与人机 / 传感器接口），每个模块列出电路要点、关键元器件、对应真题与公司应用；下方附 45 项元器件速查表。结合 TI 模拟工程师手册学习效果最佳。</p>' +
      '</div>' +
      '<div class="card"><div class="sec-title">电路模块知识库</div><div class="sec-sub">点击类别筛选；每个模块的「对应真题」可在总览清单中回溯</div>' +
        '<div class="cat-chips">' + chips + '</div>' +
        '<div id="circ-list" style="min-height:60px"></div>' +
      '</div>' +
      '<div class="card"><div class="sec-title">电路模块按类别分布</div><div class="sec-sub">六大类的模块数量</div><div class="chart-box" id="chart4"><div class="fallback" id="fb4">图表库加载失败：请联网后刷新。</div></div></div>' +
      '<div class="card"><div class="sec-title">元器件速查表</div><div class="sec-sub">按功能类别列出常用元器件与典型型号（参考件）</div>' +
        '<div class="comp-wrap"><table class="comp-table"><thead><tr><th style="width:140px">类别</th><th style="width:180px">元器件</th><th style="width:280px">典型型号</th><th>用途</th></tr></thead><tbody id="comp-body"></tbody></table></div>' +
      '</div>';
    renderCircList("all");
    Array.prototype.forEach.call(document.querySelectorAll("#view-circuits .cat-chips .chip"), function(ch){
      ch.addEventListener("click", function(){
        Array.prototype.forEach.call(document.querySelectorAll("#view-circuits .cat-chips .chip"), function(x){ x.classList.remove("cat-on"); });
        ch.classList.add("cat-on");
        renderCircList(ch.getAttribute("data-cat"));
      });
    });
    var compHtml = "";
    var lastGroup = "";
    COMP.forEach(function(c){
      if(c.group !== lastGroup){
        compHtml += '<tr class="comp-group"><td colspan="4">' + esc(c.group) + '</td></tr>';
        lastGroup = c.group;
      }
      compHtml += '<tr><td></td><td>' + esc(c.name) + '</td><td>' + esc(c.models) + '</td><td>' + esc(c.use) + '</td></tr>';
    });
    $id("comp-body").innerHTML = compHtml;
  }
  function renderCircList(cat){
    var list = CIRC.filter(function(c){ return cat === "all" || c.cat === cat; });
    var html = list.map(function(c){
      return '<div class="circ"><h4>' + esc(c.name) + '</h4>' +
        '<div class="row"><b>电路要点：</b>' + esc(c.points) + '</div>' +
        '<div class="row"><b>关键元器件：</b>' + esc(c.parts) + '</div>' +
        '<div class="row"><span class="tt2">对应真题：</span>' + esc(c.topics) + '</div>' +
        '<div class="row"><b>学习要点 / 公司应用：</b>' + esc(c.note) + '</div>' +
      '</div>';
    }).join("");
    $id("circ-list").innerHTML = html || '<p style="color:#94a3b8;padding:10px 0">该类别暂无模块</p>';
  }
  function initCircuitsCharts(){
    if(!window.echarts){ $id("fb4").style.display = "block"; return; }
    var cats = [];
    CIRC.forEach(function(c){ if(cats.indexOf(c.cat) < 0) cats.push(c.cat); });
    var c4 = echarts.init($id("chart4"));
    c4.setOption({
      backgroundColor:"transparent",
      tooltip:{trigger:"axis", triggerOn:"mousemove|click", renderMode:"richText", confine:true},
      grid:{left:6, right:30, top:10, bottom:0, containLabel:true},
      xAxis:{type:"value", minInterval:1, axisLabel:{fontSize:11, color:"#64748b"}, splitLine:{lineStyle:{color:"#eef2f7"}}},
      yAxis:{type:"category", data:cats, axisLabel:{fontSize:12, color:"#334155"}, axisLine:{lineStyle:{color:"#cbd5e1"}}, axisTick:{show:false}},
      series:[{type:"bar", barWidth:16, itemStyle:{color:"#0f766e", borderRadius:[0,4,4,0]},
        label:{show:true, position:"right", fontSize:12, color:"#475569"},
        data: cats.map(function(c){ return CIRC.filter(function(x){ return x.cat === c; }).length; })}]
    });
    window.addEventListener("resize", function(){ c4.resize(); });
  }

  route();
})();
</script>
</body>
</html>
